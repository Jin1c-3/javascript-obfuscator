[workspace]
resolver = "2"
members = [
    "crates/javascript-obfuscator",
    "crates/javascript-obfuscator-node"
]

[workspace.package]
edition = "2021"
license = "BSD-2-Clause"
repository = "https://github.com/Jin1c-3/javascript-obfuscator"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
