[workspace]
resolver = "2"
members = [
    "crates/javascript-obfuscator",
    "crates/javascript-obfuscator-node"
]

[workspace.package]
edition = "2021"
license = "BSD-2-Clause"
repository = "https://github.com/Jin1c-3/javascript-obfuscator"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
swc_common = "23"
swc_ecma_ast = "25"
swc_ecma_codegen = "28"
swc_ecma_parser = "41"
swc_ecma_visit = "25"
